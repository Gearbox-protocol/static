name: Release

on:
  push:
    branches:
      - "main"
      - "next"

env:
  HUSKY: 0
  CI: true

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write # publish GitHub release
      issues: write # semantic-release comments
      pull-requests: write # semantic-release comments
      id-token: write # OIDC for npm trusted publishing + provenance
      deployments: write # cloudflare/wrangler-action

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      # No lint or prettier here since they were supposed to run on PR action
      - name: Build
        run: pnpm build

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: "@semantic-release/exec"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT }}
          command: pages deploy public --project-name=${{ secrets.CF_PROJECT_NAME }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - uses: mfinelli/cloudflare-pages-cleanup@v1
        with:
          cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_TOKEN }}
          project: ${{ secrets.CF_PROJECT_NAME }}
          min-to-keep: 0
          max-to-keep: 0
