allowBuilds:
  esbuild: true
  workerd: true

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@gearbox-protocol/*"

trustPolicy: no-downgrade

# Edit by hand: `pnpm audit --ignore` writes here as a side effect.
auditConfig:
  ignoreGhsas:
    # picomatch <=4.0.7 has no fix; 4.0.7 is the latest release. It reaches us only
    # through dev tooling (lint-staged, tsdown via tinyglobby/fdir) and is not
    # shipped in dist. Recheck 2027-02-17.
    - GHSA-fc5q-39xc-vjpf
